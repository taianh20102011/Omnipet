name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: OmniPets
          path: target/OmniPets-*.jar

      - name: Lấy version từ pom.xml
        id: ver
        run: echo "v=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: OmniPets ${{ steps.ver.outputs.v }}
          files: target/OmniPets-*.jar

      - name: Publish Package (chỉ khi đẩy tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
